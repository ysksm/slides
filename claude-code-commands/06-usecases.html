<h1 id="06-%E2%94%80-%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9%E3%81%A8%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91">06 ─ ユースケースと使い分け</h1>
<h2 id="%E3%81%A9%E3%81%AE%E3%82%B3%E3%83%9E%E3%83%B3%E3%83%89%E3%82%92%E3%81%84%E3%81%A4%E4%BD%BF%E3%81%86%E3%81%8B">「どのコマンドを、いつ使うか」</h2>

信頼性の高い外部記事（Anthropic ブログ、Thoughtworks Radar、Simon Willison、国内の技術ブログ）から要点を抽出しました。<br />
各スライド末尾に出典を記載しています。</p>

<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>
<h2 id="%E5%A4%A7%E5%8E%9F%E5%89%87-%E3%82%B3%E3%83%B3%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88%E3%82%A6%E3%82%A3%E3%83%B3%E3%83%89%E3%82%A6%E3%81%8C%E6%9C%80%E9%87%8D%E8%A6%81%E3%83%AA%E3%82%BD%E3%83%BC%E3%82%B9">大原則: コンテキストウィンドウが最重要リソース</h2>
<div class="verdict"><strong>公式:</strong> 「ほとんどのベストプラクティスは 1 つの制約に基づく。Claude のコンテキストウィンドウはすぐ埋まり、埋まるほど性能が落ちる」</div>
<ul>
<li><code>/context</code> で使用率を見る習慣。ステータスラインに常時表示するのが公式推奨（<code>/statusline</code>）。</li>
<li>無関係なタスクの前に <code>/clear</code>。同じ会話を続けたいときだけ <code>/compact</code>。</li>
<li>調査・ログ読み・大量検索は <strong>サブエージェントに委譲</strong> して主会話を汚さない。</li>
<li>国内記事の目安: 50% 以下は余裕、50〜80% で整理を検討、80% 超は劣化リスク（著者の経験則）。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/best-practices ／ zenn.dev/sora_biz/articles/claude-code-context-management</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-theme="claude" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>
<h2 id="%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9-1-%E5%9F%BA%E6%9C%AC%E3%83%AF%E3%83%BC%E3%82%AF%E3%83%95%E3%83%AD%E3%83%BC-explore-%E2%86%92-plan-%E2%86%92-code-%E2%86%92-commit">ユースケース 1: 基本ワークフロー Explore → Plan → Code → Commit</h2>
<table>
<thead>
<tr>
<th>フェーズ</th>
<th>使うもの</th>
<th>ポイント</th>
</tr>
</thead>
<tbody>
<tr>
<td>Explore</td>
<td><code>Shift+Tab</code> で Plan / <code>claude --permission-mode plan</code></td>
<td>編集させずに関連ファイルを読ませる</td>
</tr>
<tr>
<td>Plan</td>
<td><code>/plan</code> → 計画を <code>Ctrl+G</code> でエディタ編集</td>
<td>計画が承認できるまで実装させない</td>
</tr>
<tr>
<td>Code</td>
<td>承認後に実装 + テスト</td>
<td>「テストを書いてから実装」と指示</td>
</tr>
<tr>
<td>Commit</td>
<td>「説明的なメッセージでコミットして PR を開いて」</td>
<td><code>/diff</code> で確認、<code>/code-review</code> で仕上げ</td>
</tr>
</tbody>
</table>
<div class="verdict"><strong>使い分け:</strong> 「差分を一文で説明できるならプランは省略」（公式）。タイポ修正・ログ追加・リネームは直接依頼。複数ファイルにまたがる変更、方針に迷う変更、知らないコードは Plan から。</div>
<p class="src">出典: code.claude.com/docs/en/best-practices ／ zenn.dev/tmasuyama1114/articles/claude_code_best_practice_guide</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="4" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9-2-%E6%A4%9C%E8%A8%BC%E3%81%A7%E3%81%8D%E3%81%AA%E3%81%84%E3%82%82%E3%81%AE%E3%81%AF%E5%87%BA%E8%8D%B7%E3%81%97%E3%81%AA%E3%81%84">ユースケース 2: 「検証できないものは出荷しない」</h2>
<div class="verdict"><strong>公式:</strong> 「Claude が実行できるチェックを与える: テスト、ビルド、比較用スクリーンショット。見張るセッションと離席できるセッションの違いはそこにある」</div>
<p>ゲートの強さは 4 段階。強いほどコストと拘束が増える。</p>
<ol>
<li><strong>同一プロンプト内</strong>: 「実装後にテストを回して通るまで直して」</li>
<li><strong><code>/goal</code></strong>: 「全テスト通過かつ lint ゼロ」をゴールにしてターンをまたいで再評価</li>
<li><strong>Stop フック</strong>: 条件を満たすまで終了をブロック（決定論的、8 回連続で解除）</li>
<li><strong>検証サブエージェント / ワークフロー</strong>: 別コンテキストのモデルに反証させる</li>
</ol>
<ul>
<li>「成功したと言わせるのではなく証拠を出させる」。</li>
<li><strong>Writer / Reviewer パターン</strong>: セッション A が実装、別セッション B が <code>@src/...</code> をレビュー。新しいコンテキストは自分の書いたコードに甘くならない。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/best-practices</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="5" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9-3-claudemd-%E3%81%AE%E8%82%B2%E3%81%A6%E6%96%B9">ユースケース 3: CLAUDE.md の育て方</h2>
<ul>
<li><code>/init</code> で雛形 → 使いながら磨く。<strong>200 行以下</strong> が目安（超えると遵守率が下がる）。</li>
<li>各行に「これを消したら Claude は間違えるか？」と問う。答えが No なら削る。肥大化した CLAUDE.md は指示を無視される原因。</li>
<li>書く: 推測できないビルド/テストコマンド、標準と違うスタイル、リポジトリ作法、環境の癖。</li>
<li>書かない: コードから分かること、言語の標準慣習、詳細 API、頻繁に変わる情報。</li>
<li>追加のタイミング: 同じ間違いを 2 回した / 前回と同じ訂正を打った。</li>
<li><code>/doctor</code> が「コードから導ける内容」の削除とスキルへの移行を提案してくれる。</li>
<li>国内事例: 「書くべきことより、書かなくていいことを削る方が重要」。<code>.claude/rules/</code> の <code>paths:</code> で TS 編集時だけ規約を読ませる。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/memory ／ best-practices ／ tech.enechange.co.jp/entry/2026/03/24/102016</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="6" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9-4-%E7%84%A1%E4%BA%BA%E5%AE%9F%E8%A1%8C%E3%83%BBciclaude--p">ユースケース 4: 無人実行・CI（<code>claude -p</code>）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># CI / pre-commit / スクリプト</span>
git diff main | claude -p --bare <span class="hljs-string">&quot;typo リンターとして差分を検査し JSON で報告&quot;</span> --output-format json

<span class="hljs-comment"># 大量ファイルへのファンアウト</span>
<span class="hljs-keyword">for</span> f <span class="hljs-keyword">in</span> $(<span class="hljs-built_in">cat</span> files.txt); <span class="hljs-keyword">do</span>
  claude -p --bare <span class="hljs-string">&quot;<span class="hljs-variable">$f</span> を移行して&quot;</span> --allowedTools <span class="hljs-string">&quot;Edit,Bash(git commit *)&quot;</span> --max-turns 5
<span class="hljs-keyword">done</span>
</code></pre>
<ul>
<li><strong><code>--bare</code> が公式推奨</strong>（将来 <code>-p</code> の既定に）。hooks / skills / MCP / CLAUDE.md / auto memory を読まず高速・再現的。<code>ANTHROPIC_API_KEY</code> 必須。</li>
<li>無人なら <code>--permission-prompts none</code> + <code>--max-turns</code> + <code>--max-budget-usd</code>（サブエージェント分も上限に含む）。</li>
<li><code>-p</code> は信頼ダイアログをスキップしてプロジェクトの hooks / <code>.mcp.json</code> を実行する。<strong>未知のリポジトリでは必ず <code>--bare</code></strong>。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/headless ／ cli-reference ／ best-practices</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>

<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>
<h2 id="%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9-5-git-worktree-%E3%81%A7%E4%B8%A6%E5%88%97%E3%82%BB%E3%83%83%E3%82%B7%E3%83%A7%E3%83%B3">ユースケース 5: git worktree で並列セッション</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">claude -w feature-auth            <span class="hljs-comment"># .claude/worktrees/feature-auth に隔離</span>
claude -w <span class="hljs-string">&#x27;#123&#x27;</span>                  <span class="hljs-comment"># PR/Issue 番号からブランチを切って worktree</span>
claude -w feature-auth --tmux     <span class="hljs-comment"># tmux / iTerm2 ペインで開く</span>
</code></pre>
<ul>
<li>ブランチ <code>worktree-&lt;name&gt;</code> を作成。終了時にクリーンなら自動削除、変更があれば keep / remove を確認。</li>
<li><code>.worktreeinclude</code> に <code>.env</code> などを列挙すると gitignore 済みファイルもコピーされる。<code>.gitignore</code> に <code>.claude/worktrees/</code> を追加推奨。</li>
<li>サブエージェントにも <code>isolation: worktree</code> で個別 worktree を持たせられる。</li>
<li>同時に複数のセッションやサブエージェントを回すと <strong>トークン消費は掛け算</strong>。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/worktrees ／ agents</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="8" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-1-advisor-%E3%82%92%E4%BD%BF%E3%81%86%E3%81%B9%E3%81%8D%E3%81%8B">使い分け 1: <code>/advisor</code> を使うべきか</h2>
<div class="verdict"><strong>結論:</strong> 「大半のターンは定型だが、計画の質が結果を決める長いマルチステップ作業」なら ON。短いタスクや「毎ターン最強モデルが要る」作業は OFF にして <code>/model</code> で主モデルを上げる。</div>
<ul>
<li>仕組み: 実行モデルが「方針決定前」「同じエラーで詰まった時」「完了宣言前」に、より強いモデルへ <strong>会話全体</strong> を渡して助言を得るサーバー側ツール（実験的、Anthropic API 限定）。</li>
<li>コスト: 助言のたびにアドバイザー単価で全会話を読む（キャッシュ不可）。それでも「速い主モデル + 強いアドバイザー」は「最初から強いモデル」より <strong>通常は安い</strong>。ON/OFF で主モデルのキャッシュは壊れない。</li>
<li>定番ペア: Sonnet + Opus advisor。最安: Haiku + Opus advisor。高リスク作業: Opus + Opus（独立チェック）。</li>
<li>公表ベンチ: Sonnet + Opus advisor は SWE-bench Multilingual で +2.7pt、コスト −11.9%。</li>
</ul>
<table>
<thead>
<tr>
<th>手段</th>
<th>強いモデルが効く範囲</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/advisor</code></td>
<td>作業中の判断ポイントだけ</td>
</tr>
<tr>
<td><code>opusplan</code></td>
<td>プランモード中だけ Opus</td>
</tr>
<tr>
<td>サブエージェントの <code>model:</code></td>
<td>委譲したタスク全体</td>
</tr>
<tr>
<td><code>/model opus</code></td>
<td>以降ずっと</td>
</tr>
</tbody>
</table>
<p class="src">出典: code.claude.com/docs/en/advisor ／ claude.com/blog/the-advisor-strategy</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="9" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-2-%E3%83%80%E3%82%A4%E3%83%8A%E3%83%9F%E3%83%83%E3%82%AF%E3%83%AF%E3%83%BC%E3%82%AF%E3%83%95%E3%83%AD%E3%83%BC%E3%82%92%E4%BD%BF%E3%81%86%E3%81%B9%E3%81%8D%E3%81%8B">使い分け 2: ダイナミックワークフローを使うべきか</h2>
<div class="verdict"><strong>結論:</strong> 「1 つの会話で調整できる数を超えるエージェントが要る」か「オーケストレーションをスクリプトとして読める・再実行できる形にしたい」時だけ。数個の委譲で済むならサブエージェント。</div>
<ul>
<li>仕組み: Claude が JavaScript スクリプトを書き、ランタイムがバックグラウンドで多数のサブエージェントを決定論的に実行。進捗は <code>/workflows</code>。</li>
<li>向く例: コードベース全体の監査、500 ファイル移行、相互検証付きリサーチ（<code>/deep-research</code>）、複数角度からのプラン作成。</li>
<li>起動: プロンプトに <code>ultracode</code>、「ワークフローで」と依頼、または <code>/effort ultracode</code>（<strong>全ての実質的タスクがワークフロー化</strong> し、トークンと時間が増える。常用せず、戻すときは <code>/effort high</code>）。</li>
<li><strong>Dynamic workflow size</strong>（<code>/config workflowSizeGuideline=...</code>）: <code>small</code>(&lt;5) / <code>medium</code>(&lt;15, 既定) / <code>large</code>(&lt;50) / <code>unrestricted</code>。「上限ではなく助言」。</li>
<li>コスト: 1 回で大幅にトークンを使う。まず小さなスライスで試す。25 エージェント超 or 推定 150 万トークン超で <code>Large workflow</code> 警告。同時実行 16、1 run 1,000 エージェントが上限。</li>
<li>無効化: <code>/config</code> の Dynamic workflows、<code>disableWorkflows: true</code>、<code>CLAUDE_CODE_DISABLE_WORKFLOWS=1</code>。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/workflows ／ features-overview</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="10" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-3-%E4%B8%A6%E5%88%97%E5%8C%96%E3%81%AE%E9%9A%8E%E6%AE%B5">使い分け 3: 並列化の階段</h2>
<table>
<thead>
<tr>
<th>手段</th>
<th>誰が調整するか</th>
<th>使いどころ</th>
</tr>
</thead>
<tbody>
<tr>
<td>サブエージェント（Claude が委譲）</td>
<td>Claude、ターンごと</td>
<td>検索結果・ログ・ファイル内容で主会話が溢れる副タスク</td>
</tr>
<tr>
<td><code>/subtask</code></td>
<td>Claude（会話を継承）</td>
<td>文脈を全部知った上で裏で 1 つやらせ、結果を戻す</td>
</tr>
<tr>
<td><code>/batch</code></td>
<td>Claude（worktree + サブエージェントのパッケージ）</td>
<td>5〜30 に分割できる機械的な大規模変更 → 各自 PR</td>
</tr>
<tr>
<td><code>/background</code> / <code>claude --bg</code></td>
<td>自分が手を離し後で確認</td>
<td>見張らなくてよい独立タスク。<code>claude agents</code> で監視</td>
</tr>
<tr>
<td><code>claude --worktree</code></td>
<td>自分</td>
<td>手動で並列作業、ファイル衝突回避</td>
</tr>
<tr>
<td>ダイナミックワークフロー</td>
<td>スクリプト</td>
<td>数十〜数百エージェント、再実行可能な手順</td>
</tr>
</tbody>
</table>
<ul>
<li>判断軸は「<strong>誰が仕事を調整するか</strong>」。</li>
<li>サブエージェント上限: 同時 20、ネスト 3 層。Simon Willison: 「サブエージェントの主な価値はルートのコンテキストを守ること。十数種の専門家に分割しすぎない」。</li>
<li>国内事例: 単発リファクタ・定型編集・調査だけなら単一エージェントで十分。本番機能追加で 3 エージェント程度。反復上限（3 回）を設ける。</li>
<li>エージェントチームは plan モード時に <strong>約 7 倍</strong> のトークン。Thoughtworks Radar は「小さく意図的なチーム」と「大群」を区別し Assess 扱い。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/agents ／ sub-agents ／ costs ／ simonwillison.net/guides/agentic-engineering-patterns/subagents/ ／ qiita.com/nogataka/items/efe8eb9df612d2211221 ／ thoughtworks.com/radar/techniques/team-of-coding-agents</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-4-%E4%BC%9A%E8%A9%B1%E3%81%AE%E6%95%B4%E7%90%86%E3%83%BB%E5%88%86%E5%B2%90compact-clear-resume-rewind-branch-fork">使い分け 4: 会話の整理・分岐（<code>/compact</code> <code>/clear</code> <code>/resume</code> <code>/rewind</code> <code>/branch</code> <code>/fork</code>）</h2>
<table>
<thead>
<tr>
<th>コマンド</th>
<th>何が起きる</th>
<th>使う場面</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/clear</code></td>
<td>空コンテキストで新会話（前の会話は <code>/resume</code> 可）</td>
<td>無関係タスクへ切替、<strong>2 回直しても直らない時</strong></td>
</tr>
<tr>
<td><code>/compact [指示]</code></td>
<td>履歴を要約に置換</td>
<td>同一タスク継続中で文脈を残したい時</td>
</tr>
<tr>
<td><code>/resume</code></td>
<td>別の保存済み会話へ切替</td>
<td>数日にまたがる作業（<code>/rename</code> で名前付け運用）</td>
</tr>
<tr>
<td><code>/rewind</code>（<code>Esc Esc</code>）</td>
<td>チェックポイントへ会話 / コード / 両方を戻す、部分要約</td>
<td>失敗した試行の取消、危険な試行の前</td>
</tr>
<tr>
<td><code>/branch</code></td>
<td>コピーに <strong>自分が乗り換える</strong></td>
<td>別アプローチを試す</td>
</tr>
<tr>
<td><code>/fork</code></td>
<td>コピーを <strong>バックグラウンドで走らせ</strong> 自分は残る</td>
<td>並行で別作業</td>
</tr>
</tbody>
</table>
<ul>
<li><code>/compact</code> は会話全体を読む大きなリクエスト。「続きが要らないなら <code>/clear</code> はタダ」。</li>
<li>圧縮後も CLAUDE.md は再読込されるが、会話中だけで与えた指示は消える。CLAUDE.md に「圧縮時は変更ファイル一覧とテストコマンドを必ず残す」と書ける。</li>
<li>チェックポイントは <strong>Claude の編集ツール経由の変更のみ</strong> 追跡。Bash での変更は対象外、git の代替ではない。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/best-practices ／ sessions ／ costs ／ checkpointing</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-5-%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC%E7%B3%BB-4-%E3%82%B3%E3%83%9E%E3%83%B3%E3%83%89code-review-security-review-ultra-simplify">使い分け 5: レビュー系 4 コマンド（<code>/code-review</code> <code>/security-review</code> <code>ultra</code> <code>/simplify</code>）</h2>
<table>
<thead>
<tr>
<th></th>
<th>目的</th>
<th>場所</th>
<th>コスト</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/code-review [low..max]</code></td>
<td>正確性バグ + 整理。差分 / PR / ブランチ / パス</td>
<td>ローカル（新しいサブエージェント）</td>
<td>通常</td>
</tr>
<tr>
<td><code>/security-review</code></td>
<td>インジェクション・認証・情報漏洩など脆弱性</td>
<td>ローカル</td>
<td>通常</td>
</tr>
<tr>
<td><code>/code-review ultra</code>（<code>/ultrareview</code>）</td>
<td>クラウドの多数レビュワーが全指摘を独立再現・検証</td>
<td>クラウド（claude.ai ログイン、ZDR 組織不可）</td>
<td>Pro/Max 3 回無料、以後おおむね $5〜25、5〜10 分</td>
</tr>
<tr>
<td><code>/simplify</code></td>
<td>再利用・単純化・効率・抽象度を 4 エージェントで修正適用。<strong>バグは探さない</strong></td>
<td>ローカル</td>
<td>通常</td>
</tr>
</tbody>
</table>
<div class="verdict"><strong>公式:</strong> 「作業中の素早いフィードバックには <code>/code-review</code>、大きな変更をマージする前に <code>/code-review ultra</code>」。CI からは <code>claude ultrareview --json --post</code>。</div>
<ul>
<li>レビュワーは「隙を探せ」と言われると健全なコードにも指摘を出す。<strong>正確性か要件に影響する指摘だけ</strong> 追う。全部追うと過剰設計になる。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/commands ／ ultrareview ／ best-practices</p>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-6-model-vs-effort-vs-fast-vs---fallback-model">使い分け 6: <code>/model</code> vs <code>/effort</code> vs <code>/fast</code> vs <code>--fallback-model</code></h2>
<table>
<thead>
<tr>
<th>手段</th>
<th>変わるもの</th>
<th>使う場面</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/model</code></td>
<td>モデル自体（<code>sonnet</code> 日常 / <code>opus</code> 複雑推論 / <code>haiku</code> 軽作業 / <code>opusplan</code> 計画だけ Opus）</td>
<td>「Sonnet で大半をこなし、複雑な設計判断だけ Opus」が公式のコスト方針</td>
</tr>
<tr>
<td><code>/effort</code></td>
<td>推論量（<code>low</code> = 短く遅延重視、<code>high</code> = 既定、<code>max</code> = 考えすぎがち）</td>
<td>単発で深く考えさせたいだけなら <code>ultrathink</code> をプロンプトに</td>
</tr>
<tr>
<td><code>/fast</code></td>
<td>同じモデル・同じ品質で <strong>最大 2.5 倍速、トークン単価は高い</strong></td>
<td>高速反復・ライブデバッグ。長い自律タスク・バッチ・CI・コスト重視は標準モード</td>
</tr>
<tr>
<td><code>--fallback-model sonnet,haiku</code></td>
<td>主モデルが過負荷・停止時に自動切替（最大 3 つ、そのターンのみ）</td>
<td>認証・課金・レート制限では発動しない</td>
</tr>
</tbody>
</table>
<ul>
<li>fast と effort の違い: fast は「同品質・低遅延・高コスト」、effort 低下は「思考時間減・高速・品質低下の可能性」。</li>
<li><strong>fast は会話の途中で ON にしない</strong>: 全コンテキストが fast 単価で再課金される。使うならセッション開始時から。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/model-config ／ fast-mode ／ costs</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-class="dense" data-theme="claude" lang="en-US" class="dense" data-marpit-pagination="14" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--class:dense;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-7-%E6%A8%A9%E9%99%90%E3%83%A2%E3%83%BC%E3%83%89%E3%81%A8%E8%B5%B7%E5%8B%95%E3%83%A2%E3%83%BC%E3%83%89">使い分け 7: 権限モードと起動モード</h2>
<table>
<thead>
<tr>
<th>モード / フラグ</th>
<th>何が自動化されるか</th>
<th>想定</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>default</code>（Manual）</td>
<td>読み取りのみ</td>
<td>初期状態</td>
</tr>
<tr>
<td><code>acceptEdits</code></td>
<td>編集と mkdir / mv など</td>
<td>信頼できる作業</td>
</tr>
<tr>
<td><code>plan</code></td>
<td>読み取りのみ</td>
<td>調査・計画</td>
</tr>
<tr>
<td><code>auto</code></td>
<td>全部。バックグラウンドの安全分類器が危険操作を止める</td>
<td>Pro/Max/Team の既定</td>
</tr>
<tr>
<td><code>dontAsk</code></td>
<td>確認が要るものは自動拒否</td>
<td>ロックダウンした CI</td>
</tr>
<tr>
<td><code>bypassPermissions</code> = <code>--dangerously-skip-permissions</code></td>
<td>全部。deny ルールだけ有効</td>
<td><strong>隔離コンテナ / VM のみ、非 root</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><code>/permissions</code> でルール管理、<code>/fewer-permission-prompts</code> で読み取り系を一括許可、<code>/sandbox</code> で隔離実行。</li>
<li><code>--restricted</code>: 共有マシンで評価ハーネスが動かす用途。コマンド実行ツールと WebFetch を除去、設定は managed のみ。</li>
<li><code>--safe-mode</code>: <strong>設定が壊れた時の切り分け</strong>（カスタマイズ全無効、認証・モデル・組み込みツールは通常）。</li>
<li><code>--bare</code>: <strong>スクリプト・CI の高速再現実行</strong>（自動検出をすべてスキップ）。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/permission-modes ／ cli-reference ／ best-practices</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>

<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-8-%E6%A9%9F%E8%83%BD%E3%82%92%E8%B6%B3%E3%81%99%E3%81%A8%E3%81%8Dclaudemd--skill--hook--mcp--plugin">使い分け 8: 機能を足すとき（CLAUDE.md / Skill / Hook / MCP / Plugin）</h2>
<table>
<thead>
<tr>
<th>こうなったら</th>
<th>こうする</th>
</tr>
</thead>
<tbody>
<tr>
<td>同じ間違いを 2 回した</td>
<td>CLAUDE.md に 1 行</td>
</tr>
<tr>
<td>同じプロンプトを繰り返し打っている</td>
<td>Skill（<code>.claude/skills/&lt;name&gt;/SKILL.md</code>）</td>
</tr>
<tr>
<td>ブラウザからコピペしている</td>
<td>MCP サーバー（ただし <code>gh</code> <code>aws</code> などの <strong>CLI があればそちらが文脈効率で優位</strong>）</td>
</tr>
<tr>
<td>出力が会話を汚す</td>
<td>Subagent</td>
</tr>
<tr>
<td>毎回必ず起こしたい</td>
<td><strong>Hook</strong>（CLAUDE.md は「お願い」、Hook は「保証」）</td>
</tr>
<tr>
<td>別リポジトリでも同じ設定</td>
<td>Plugin（<code>.claude/</code> で試作 → 配布時に Plugin 化）</td>
</tr>
</tbody>
</table>
<ul>
<li><code>.claude/commands/deploy.md</code> と <code>.claude/skills/deploy/SKILL.md</code> は <strong>同じ <code>/deploy</code> を作る（統合済み）</strong>。新規はスキル推奨（補助ファイルを持てる）。</li>
<li>副作用のあるスキル（deploy 等）は <code>disable-model-invocation: true</code> で手動のみに。</li>
<li>ガードレール例: 「<code>.env</code> を編集するな」は CLAUDE.md では請願、<code>PreToolUse</code> フックでブロックすれば強制。フックのコンテキストコストは出力を返さない限りゼロ。</li>
<li>未使用の MCP は <code>/mcp</code> で無効化、<code>/context all</code> でツール別トークンを確認。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/features-overview ／ skills ／ hooks-guide ／ plugins ／ costs</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>

<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-9-%E5%AE%9A%E6%9C%9F%E5%AE%9F%E8%A1%8Cloop--schedule--desktop--github-actions">使い分け 9: 定期実行（<code>/loop</code> / <code>/schedule</code> / Desktop / GitHub Actions）</h2>
<table>
<thead>
<tr>
<th></th>
<th><code>/loop</code></th>
<th><code>/schedule</code> Routines</th>
<th>Desktop scheduled task</th>
<th>GitHub Actions</th>
</tr>
</thead>
<tbody>
<tr>
<td>実行場所</td>
<td>今の CLI セッション</td>
<td>クラウド（Anthropic 管理）</td>
<td>自分の PC</td>
<td>CI</td>
</tr>
<tr>
<td>PC / セッション</td>
<td>両方必要</td>
<td>不要</td>
<td>PC 必要</td>
<td>不要</td>
</tr>
<tr>
<td>最小間隔</td>
<td>1 分</td>
<td>1 時間</td>
<td>1 分</td>
<td>─</td>
</tr>
<tr>
<td>ローカルファイル</td>
<td>可</td>
<td>不可（fresh clone）</td>
<td>可</td>
<td>─</td>
</tr>
<tr>
<td>寿命</td>
<td>7 日で失効</td>
<td>永続</td>
<td>永続</td>
<td>永続</td>
</tr>
</tbody>
</table>
<div class="verdict"><strong>公式:</strong> 「マシンなしで確実に動かすならクラウド、ローカルファイルとツールが要るなら Desktop、セッション中の手早いポーリングなら <code>/loop</code>」</div>
<ul>
<li><code>/loop</code> の落とし穴: セッションを閉じると止まる、取りこぼしの追い付き実行なし、毎回フルコンテキストを送るので待機中も消費。</li>
<li>Routines は <strong>権限プロンプトが一切ない</strong>。コネクタ・リポジトリ・ネットワークを最小化。ローカルの <code>claude mcp add</code> は使えない。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/scheduled-tasks ／ routines ／ common-workflows</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>

<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91-10-%E7%8A%B6%E6%85%8B%E3%82%92%E8%A6%8B%E3%82%8B-%E2%94%80-btw-context-usage-insights">使い分け 10: 状態を見る ─ <code>/btw</code> <code>/context</code> <code>/usage</code> <code>/insights</code></h2>
<table>
<thead>
<tr>
<th>コマンド</th>
<th>見えるもの</th>
<th>使いどころ</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/btw</code></td>
<td>会話が既に知っていることへの答え（ツール無し・履歴に残らない）</td>
<td>「このセッションで何を変えた？」級の脇質問。<strong>調べ物はサブエージェント</strong></td>
</tr>
<tr>
<td><code>/context [all]</code></td>
<td>使用率グリッド、重いツール、メモリ肥大、CLAUDE.md の読込有無、MCP ツール別トークン</td>
<td>圧縮 / クリアの判断</td>
</tr>
<tr>
<td><code>/usage</code>（<code>/cost</code> <code>/stats</code>）</td>
<td>セッションコスト、プラン上限、skills / subagents / plugins / MCP 別の帰属、<code>/loop</code> 別消費、cache miss 警告</td>
<td>何が高いかの特定</td>
</tr>
<tr>
<td><code>/insights</code></td>
<td>直近セッションの HTML レポート（摩擦点、提案）</td>
<td>振り返り</td>
</tr>
</tbody>
</table>
<ul>
<li>長時間セッションの隠れコスト: 一日中開いたセッションの一行質問でも <strong>会話全体分</strong> を消費。休憩後のキャッシュ失効（サブスク 1 時間、API 5 分）で全文再処理。</li>
<li>想定外の高額の典型: 「クリアされない長いセッション」と「Opus をデフォルトのまま」。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/commands ／ interactive-mode ／ costs</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>

<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>

<h2 id="%E3%82%88%E3%81%8F%E3%81%82%E3%82%8B%E5%A4%B1%E6%95%97%E3%83%91%E3%82%BF%E3%83%BC%E3%83%B3%E5%85%AC%E5%BC%8F-5-%E3%81%A4--%CE%B1">よくある失敗パターン（公式 5 つ + α）</h2>
<ol>
<li><strong>ごった煮セッション</strong> ─ 無関係タスクを混ぜる → <code>/clear</code>。</li>
<li><strong>何度も訂正し続ける</strong> ─ 2 回直して駄目なら <code>/clear</code> して最初のプロンプトを良くする。</li>
<li><strong>過剰仕様の CLAUDE.md</strong> ─ 長いと半分無視される → 容赦なく削る、または Hook に変換。</li>
<li><strong>信じて検証しない</strong> ─ 「検証できないなら出荷しない」。</li>
<li><strong>無限の探索</strong> ─ 「調べて」を無限定に頼まない。スコープを切るかサブエージェントへ。</li>
</ol>
<ul>
<li><strong>権限の出し過ぎ</strong>: bypass は隔離環境のみ。<code>-p</code> は未知リポジトリで <code>--bare</code>。</li>
<li><strong>サブエージェント / チーム / ワークフローの使い過ぎ</strong>: トークンは掛け算。小さく試す。</li>
<li><strong>レビュワーの指摘を全部追う</strong>: 過剰設計。正確性・要件に関わるものだけ。</li>
<li><strong>AI 生成コードへの安住</strong>: Thoughtworks Radar は Claude Code を Adopt としつつ、「保守性低下」を警告。フィードバックセンサーとアーキテクチャ適合関数を推奨。</li>
<li><strong>チェックポイントを git 代わりにする</strong>: Bash 経由の変更は戻らない。</li>
</ul>
<p class="src">出典: code.claude.com/docs/en/best-practices ／ costs ／ headless ／ thoughtworks.com/radar/tools/claude-code</p>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Claude Code コマンド一覧 ─ 06 ユースケースと使い分け" data-footer="出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点" data-theme="claude" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:Claude Code コマンド一覧 ─ 06 ユースケースと使い分け;--footer:出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点;--theme:claude;" data-marpit-pagination-total="19">
<header>Claude Code コマンド一覧 ─ 06 ユースケースと使い分け</header>
<h2 id="%E3%81%BE%E3%81%A8%E3%82%81-%E4%B8%80%E8%A8%80%E3%83%AB%E3%83%BC%E3%83%AB">まとめ: 一言ルール</h2>
<ul>
<li><strong>コンテキストは最重要資源</strong> → <code>/clear</code> を惜しまず、<code>/context</code> を見て、調査はサブエージェントへ。</li>
<li><strong>検証できないものは出荷しない</strong> → テスト / ビルド / スクショ、Stop フック、<code>/code-review</code>、マージ前は <code>ultra</code>。</li>
<li><strong>守らせたいルールは Hook、知っておいてほしいことは CLAUDE.md、時々必要な知識は Skill、外部接続は MCP、配布は Plugin</strong>。</li>
<li><strong>強いモデルは点で使う</strong> → <code>/advisor</code>、<code>opusplan</code>、サブエージェントの <code>model:</code>。常時 Opus は最後の手段。</li>
<li><strong>並列は手段</strong> → サブエージェント → <code>/batch</code> / <code>--bg</code> → ワークフローの順に、コストを見ながら段階的に。</li>
<li><strong>無人実行は <code>--bare -p</code> + 権限最小化 + コンテナ内でのみ bypass</strong>。</li>
</ul>
<blockquote>
<p>迷ったら <code>/help</code>、調子が悪ければ <code>/doctor</code>、高いと思ったら <code>/usage</code>。</p>
</blockquote>
<footer>出典: code.claude.com/docs（best-practices / costs / advisor / workflows / agents ほか）2026-09 時点</footer>
